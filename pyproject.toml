[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasterwam"
version = "0.1.0"
description = "FasterWAM: efficient world-action model training and inference"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "deepspeed==0.18.5",
  "einops==0.8.1",
  "ftfy==6.3.1",
  "gitpython==3.1.45",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "h5py==3.14.0",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "pyyaml==6.0.2",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.7.1+cu128",
  "torchcodec==0.5",
  "torchvision==0.22.1+cu128",
  "tqdm==4.66.5",
  "transformers==4.49.0",
  "typing-extensions==4.15.0",
  "wandb==0.23.1",
]

[project.urls]
Repository = "https://github.com/hustvl/FasterWAM"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fasterwam*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchcodec = [{ index = "pytorch-cu128" }]

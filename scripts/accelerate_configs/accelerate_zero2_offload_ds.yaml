compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: scripts/ds_configs/ds_zero2_offload_config.json
  zero3_init_flag: false

# Precision is supplied by Wan22Trainer/Accelerator and the resolved training
# config; keep this null when using an external DeepSpeed JSON.
mixed_precision: null

machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
use_cpu: false

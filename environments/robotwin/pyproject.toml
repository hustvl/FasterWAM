[project]
name = "fasterwam-robotwin-environment"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "einops==0.8.1",
  "ffmpeg==1.4",
  "ftfy==6.3.1",
  "gymnasium==0.29.1",
  "gitpython==3.1.45",
  "h5py==3.16.0",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "imageio==2.34.2",
  "imageio-ffmpeg==0.6.0",
  "importlib-resources==7.1.0",
  "ipywidgets==8.1.8",
  "jsonlines==4.0.0",
  "matplotlib==3.10.9",
  "moviepy==2.2.1",
  "mplib==0.2.1",
  "ninja==1.13.0",
  "numcodecs==0.13.1",
  "numpy==1.26.4",
  "numpy-quaternion==2024.0.13",
  "omegaconf==2.3.0",
  "open3d==0.18.0",
  "opencv-python==4.11.0.86",
  "pandas==2.2.3",
  "pillow==11.3.0",
  "pyarrow==23.0.0",
  "pybind11==3.0.4",
  "pydantic==2.13.4",
  "pyglet==1.5.31",
  "pyyaml==6.0.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "sapien==3.0.0b1",
  "scikit-image==0.25.2",
  "scipy==1.15.3",
  "setuptools==80.10.2",
  "setuptools-scm==9.2.2",
  "termcolor==2.5.0",
  "torch==2.4.1+cu121",
  "torchvision==0.19.1+cu121",
  "tqdm==4.66.5",
  "transformers==4.49.0",
  "transforms3d==0.4.2",
  "trimesh==4.4.3",
  "typing-extensions==4.15.0",
  "warp-lang==0.10.1",
  "wheel==0.46.3",
  "yourdfpy==0.0.60",
  "zarr==2.18.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

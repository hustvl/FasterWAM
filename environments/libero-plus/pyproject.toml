[project]
name = "fasterwam-libero-plus-environment"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "bddl==1.0.1",
  "boto3==1.35.99",
  "cloudpickle==2.1.0",
  "cmake==3.31.10",
  "datasets==3.6.0",
  "easydict==1.9",
  "einops==0.8.1",
  "ftfy==6.3.1",
  "future==1.0.0",
  "gym==0.25.2",
  "gitpython==3.1.45",
  "h5py==3.14.0",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "matplotlib==3.10.9",
  "mujoco==3.3.2",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "opencv-python-headless==4.11.0.86",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "pyyaml==6.0.2",
  "regex==2025.11.3",
  "rich==14.2.0",
  "robomimic==0.2.0",
  "robosuite==1.4.0",
  "safetensors==0.5.3",
  "scikit-image==0.25.2",
  "termcolor==2.5.0",
  "thop==0.1.1.post2209072238",
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "tqdm==4.66.5",
  "transformers==4.49.0",
  "typing-extensions==4.15.0",
  "wand==0.6.13",
  "wheel==0.46.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake==3.31.10"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

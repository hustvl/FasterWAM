# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fasterwam
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
eval_every: 0

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

default_action_infer_mode: one_pass_future_cache

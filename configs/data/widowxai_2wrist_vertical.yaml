# WidowXAI without the high/top camera. The two wrist views are composed into
# the same 384x320 input used during training:
#   top half    = cam_left_wrist
#   bottom half = cam_right_wrist
# Each 4:3 wrist view is aspect-fitted and neutral-gray padded horizontally.

_shape_meta: &shape_meta
  images:
    - key: cam_left_wrist
      raw_shape: [3, 480, 640]
      shape: [3, 240, 320]
    - key: cam_right_wrist
      raw_shape: [3, 480, 640]
      shape: [3, 240, 320]
  action:
    - key: default
      raw_shape: 14
      shape: 14
  state:
    - key: default
      raw_shape: 14
      shape: 14

_relative_joint_mask: &relative_joint_mask
  default:
    [true, true, true, true, true, true, false,
     true, true, true, true, true, true, false]

_processor: &processor
  _target_: fasterwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
  shape_meta: ${data.train.shape_meta}
  num_obs_steps: ${data.train.num_frames}
  num_output_cameras: 2
  action_output_dim: 14
  proprio_output_dim: 14

  action_state_transforms:
    - _target_: fasterwam.datasets.lerobot.transforms.relative_action.MaskedRelativeJointTransform
      dim_masks: *relative_joint_mask
  use_stepwise_action_norm: false
  norm_default_mode: "z-score"
  norm_exception_mode: null

  action_state_merger:
    _target_: fasterwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

  train_transforms:
    - _target_: fasterwam.datasets.lerobot.transforms.image.ToTensor
    - _target_: torchvision.transforms.Resize
      size: [240, 320]
  val_transforms:
    - _target_: fasterwam.datasets.lerobot.transforms.image.ToTensor
    - _target_: torchvision.transforms.Resize
      size: [240, 320]

train:
  _target_: fasterwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /lustre/data/dreamzero/real_widowxai_success_only
  shape_meta: *shape_meta
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: /lustre/data/fastwam_nakamura/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "vertical"
  drop_top_view: true
  processor: *processor
  text_embedding_cache_dir: /lustre/data/fastwam_nakamura/text_embeds_cache/widowxai
  context_len: 128

val:
  _target_: fasterwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /lustre/data/dreamzero/real_widowxai_test
  shape_meta: *shape_meta
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: false
  pretrained_norm_stats: /lustre/data/fastwam_nakamura/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "vertical"
  drop_top_view: true
  processor: *processor
  text_embedding_cache_dir: /lustre/data/fastwam_nakamura/text_embeds_cache/widowxai
  context_len: 128
